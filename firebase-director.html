<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1420"><title>Blackthorn — Director Login</title>
<style>
body{margin:0;min-height:100vh;background:radial-gradient(circle at 40% 0,#23354d,#080e19);font:16px Georgia,serif;color:#f0e5d0;display:grid;place-items:center}
main{width:min(440px,88vw);border:1px solid #8a7554;background:#101d2d;padding:2rem;box-shadow:0 20px 70px #0008}
h1{font-size:1.6rem;font-weight:normal}p{line-height:1.5}
label{display:block;margin:18px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;background:#f8f4ee;color:#12213a;border:1px solid #b5a17f;font:16px sans-serif}
button{margin-top:24px;width:100%;padding:14px;border:1px solid #9b855d;background:#c1a776;color:#0c1523;font-weight:bold;cursor:pointer}
small{display:block;margin-top:20px;line-height:1.5;color:#c9bb9f}#status{min-height:1.4em}</style></head>
<body><main><p>✦ BLACKTHORN ACADEMY</p><h1>Director Authentication</h1>
<p>Sign in with the Firebase Director account. Your password is used only by Firebase Authentication and is never stored in the Blackthorn repository.</p>
<form id="login"><label for="email">Director email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form><p id="status" role="status"></p>
<small>Firebase preview rehearsal only. Never enter Blackthorn private story invitation codes here.</small></main>
<script src="firebase-config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const qs=new URLSearchParams(location.search),session=qs.get('session')||'';
const el=document.getElementById('status');
const cfg=window.BLACKTHORN_FIREBASE_CONFIG||{};
const ok=['apiKey','authDomain','databaseURL','projectId','appId'].every(k=>typeof cfg[k]==='string'&&cfg[k].length>3);
let auth=null;
try{if(!ok)throw Error('Firebase configuration has not been completed.');auth=getAuth(initializeApp(cfg,'blackthorn-preview'));}catch(e){el.textContent=e.message;}
document.getElementById('login').addEventListener('submit',async e=>{
 e.preventDefault();if(!auth)return;
 const btn=e.currentTarget.querySelector('button');btn.disabled=true;el.textContent='Signing in…';
 try{
   await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);
   const url=new URL('./',location.href);url.searchParams.set('backend','firebase');
   if(/^[A-Za-z0-9_-]{16,64}$/.test(session))url.searchParams.set('session',session);
   url.searchParams.set('director','1');location.assign(url.toString());
 }catch(err){el.textContent='Login unsuccessful. Check your Firebase email/password and permissions.';btn.disabled=false;}
});
</script></body></html>
